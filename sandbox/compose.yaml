services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: ["start-dev", "--import-realm"]
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: lab-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${LAB_ADMIN_PASSWORD:?Set LAB_ADMIN_PASSWORD}
      LAB_CLIENT_SECRET: ${LAB_CLIENT_SECRET:?Set LAB_CLIENT_SECRET}
    volumes:
      - "./portfolio-lab-realm.json:/opt/keycloak/data/import/portfolio-lab-realm.json:ro"
      - "keycloak-data:/opt/keycloak/data"
volumes:
  keycloak-data:
