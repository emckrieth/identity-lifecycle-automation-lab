display_information:
  name: Portfolio IT Lab
  description: Approval-gated fictional identity and asset requests
features:
  bot_user:
    display_name: portfolio-it-lab
    always_online: false
  slash_commands:
    - command: /lab-onboard
      description: Request a fictional lab joiner
      usage_hint: lab-username LAB-ASSET
      url: https://replace-me.example/slack/commands
    - command: /lab-offboard
      description: Request a fictional lab leaver
      usage_hint: lab-username LAB-ASSET
      url: https://replace-me.example/slack/commands
oauth_config:
  scopes:
    bot:
      - commands
settings:
  org_deploy_enabled: false
  socket_mode_enabled: false
_metadata:
  major_version: 1
  minor_version: 1
