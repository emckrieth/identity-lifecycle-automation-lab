services:
  app:
    image: snipe/snipe-it:v8.8.1
    ports:
      - "127.0.0.1:8090:80"
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - asset-storage:/var/lib/snipeit
  db:
    image: mariadb:11.4.7
    environment:
      MYSQL_DATABASE: snipeit
      MYSQL_USER: snipeit
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
    volumes:
      - asset-db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  asset-storage:
  asset-db:
